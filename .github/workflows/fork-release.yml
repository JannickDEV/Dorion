name: Fork release

# Publishes this fork's own builds as GitHub releases, so Dorion's updater
# (pointed at JannickDEV/Dorion) installs this build instead of SpikeHD's.
#
# - A release is created when the version in tauri.conf.json has no release yet,
#   as soon as the Windows and Linux installers built successfully, even if macOS failed.
# - Files missing from an existing release (typically the macOS .dmg after
#   "Retry macOS build" succeeded) are added, but only from a build of the same
#   commit the release was made from, so one release never mixes different code.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the build to release
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            read -r run_id sha < <(gh run list -w build.yml -b main --status completed -L 20 \
              --json databaseId,headSha,conclusion \
              --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0] | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$run_id" ] && [ "$run_id" != "null" ] || { echo "No completed Build run on main"; exit 1; }
          echo "Using Build run $run_id ($sha)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Read version and existing release
        id: version
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            target=$(gh release view "v$version" --json targetCommitish --jq .targetCommitish)
            if [ "$target" != "$SHA" ]; then
              echo "v$version was released from $target, not $SHA; leaving it unchanged."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            else
              echo "mode=add" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.version.outputs.mode != 'skip'
        run: gh run download "${{ steps.run.outputs.run_id }}" -D artifacts || true

      - name: Rename artifacts
        if: steps.version.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p renamed
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            case "$(basename "$dir")" in
              dorion-aarch64-apple-darwin-dmg) name="Dorion_${VERSION}_aarch64.dmg" ;;
              dorion-x86_64-apple-darwin-dmg) name="Dorion_${VERSION}_x64.dmg" ;;
              dorion-aarch64-pc-windows-msvc-nsis) name="Dorion_${VERSION}.arm64-setup.exe" ;;
              dorion-aarch64-pc-windows-msvc-portable) name="Dorion_${VERSION}_win_arm64_portable.zip" ;;
              dorion-x86_64-pc-windows-msvc-nsis) name="Dorion_${VERSION}_x64-setup.exe" ;;
              dorion-x86_64-pc-windows-msvc-msi) name="Dorion_${VERSION}_x64_en-US.msi" ;;
              dorion-x86_64-pc-windows-msvc-portable) name="Dorion_${VERSION}_win64_portable.zip" ;;
              dorion-aarch64-unknown-linux-gnu-deb) name="Dorion_${VERSION}_arm64.deb" ;;
              dorion-aarch64-unknown-linux-gnu-portable) name="Dorion_${VERSION}_arm64_portable.tar.gz" ;;
              dorion-aarch64-unknown-linux-gnu-rpm) name="Dorion_${VERSION}-1.aarch64.rpm" ;;
              dorion-x86_64-unknown-linux-gnu-deb) name="Dorion_${VERSION}_amd64.deb" ;;
              dorion-x86_64-unknown-linux-gnu-flatpak) name="Dorion_${VERSION}.flatpak" ;;
              dorion-x86_64-unknown-linux-gnu-portable) name="Dorion_${VERSION}_amd64_portable.tar.gz" ;;
              dorion-x86_64-unknown-linux-gnu-rpm) name="Dorion_${VERSION}-1.x86_64.rpm" ;;
              *) continue ;;
            esac
            file=$(find "$dir" -type f -print -quit)
            [ -n "$file" ] && cp "$file" "renamed/$name"
          done
          ls -la renamed

      - name: Create release
        if: steps.version.outputs.mode == 'create'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          # The Windows installers (the updater uses the .msi) and the Linux .deb must exist
          for required in "Dorion_${VERSION}_x64_en-US.msi" "Dorion_${VERSION}_x64-setup.exe" "Dorion_${VERSION}_amd64.deb"; do
            if [ ! -f "renamed/$required" ]; then
              echo "::notice::Not releasing v$VERSION yet: $required was not built."
              exit 0
            fi
          done
          notes="Built by GitHub Actions from $SHA. Includes the Illegalcord client mod and per-profile tray launchers."
          if ! ls renamed/*.dmg >/dev/null 2>&1; then
            notes="$notes

          macOS files are missing because GitHub had no macOS build capacity. They're added here automatically once a retry succeeds."
          fi
          gh release create "v$VERSION" renamed/* \
            --target "$SHA" \
            --title "v$VERSION (JannickDEV fork)" \
            --notes "$notes" \
            --latest

      - name: Add missing files to existing release
        if: steps.version.outputs.mode == 'add'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          added=0
          for file in renamed/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if ! grep -qxF "$name" <<< "$existing"; then
              echo "Adding $name to v$VERSION"
              gh release upload "v$VERSION" "$file"
              added=$((added + 1))
            fi
          done
          echo "Added $added file(s)."
          if [ "$added" -gt 0 ] && ls renamed/*.dmg >/dev/null 2>&1; then
            body=$(gh release view "v$VERSION" --json body --jq .body | sed '/macOS files are missing/d')
            gh release edit "v$VERSION" --notes "$body"
          fi
