name: Retry macOS build

# GitHub's hosted macOS runners are sometimes unavailable, and the macOS jobs
# then get cancelled after waiting ("job was not acquired by Runner"). When a
# Build run on main failed ONLY in macOS jobs, re-run just the failed jobs,
# waiting longer each time. Real failures on other platforms are never retried.
# When a retry succeeds, "Fork release" adds the .dmg files to that release.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt < 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Check that only macOS jobs failed
        id: check
        run: |
          jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name')
          echo "Failed or cancelled jobs:"
          echo "$jobs"
          if [ -z "$jobs" ]; then
            echo "Nothing failed; not retrying."
            exit 0
          fi
          if echo "$jobs" | grep -qv 'apple-darwin'; then
            echo "A non-macOS job failed. That's a real failure, so not retrying."
            exit 0
          fi
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Wait for macOS runner capacity
        if: steps.check.outputs.retry == 'true'
        run: |
          case "$ATTEMPT" in
            1) delay=300 ;;
            2) delay=900 ;;
            *) delay=1800 ;;
          esac
          echo "Attempt $ATTEMPT failed on macOS only; waiting ${delay}s before retrying."
          sleep "$delay"

      - name: Re-run failed macOS jobs
        if: steps.check.outputs.retry == 'true'
        run: |
          # Skip if a newer commit has been built meanwhile (that run supersedes this one)
          latest=$(gh run list -w build.yml -b main -L 1 --json databaseId --jq '.[0].databaseId')
          if [ "$latest" != "$RUN_ID" ]; then
            echo "A newer Build run ($latest) exists; not retrying $RUN_ID."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed
